[base]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=false
pre_init_hooks="export SHELL=/usr/bin/zsh; dnf -y copr enable dejan/lazygit"

[fedorabox]
include=base
hostname="fedorabox"
home=~/distrobox-homes/fedorabox
volume="$HOME/.gitconfig:$HOME/distrobox-homes/fedorabox/.gitconfig:ro"
volume="$HOME/.ssh:$HOME/distrobox-homes/fedorabox/.ssh:ro"
volume="$HOME/.zshrc:$HOME/distrobox-homes/fedorabox/.zshrc:ro"
volume="$HOME/.oh-my-zsh:$HOME/distrobox-homes/fedorabox/.oh-my-zsh:ro"
volume="$HOME/.config/micro:$HOME/distrobox-homes/fedorabox/.config/micro:ro"

[dev-base]
include=base
init_hooks="su - matteo $HOME/distrobox-homes/setup/zed-setup.sh"
additional_packages="java-25-openjdk-devel mesa-libGL"
#additional_packages="libXi"

[dev-go]
include=dev-base
hostname="dev-go"
home=~/distrobox-homes/dev-go

# --- SHARED CREDENTIALS ---
volume="$HOME/.gitconfig:$HOME/distrobox-homes/dev-go/.gitconfig:ro"
volume="$HOME/.ssh:$HOME/distrobox-homes/dev-go/.ssh:ro"

# --- SHARED SHELL CONFIGURATION ---
# 1. Mount your main Zsh config
volume="$HOME/.zshrc:$HOME/distrobox-homes/dev-go/.zshrc:ro"

# 2. Mount the entire Oh-My-Zsh folder
# This ensures all your plugins and themes from the host are available
volume="$HOME/.oh-my-zsh:$HOME/distrobox-homes/dev-go/.oh-my-zsh:ro"

#volume="$HOME/distrobox-homes/setup/go-setup.sh:$HOME/distrobox-homes/dev-go/go-setup.sh:ro"
# 3. (Optional) If you use Powerlevel10k or Starship, mount their configs too
# volume="$HOME/.p10k.zsh:$HOME/distrobox-homes/dev-go/.p10k.zsh"
# volume="$HOME/.config/starship.toml:$HOME/distrobox-homes/dev-go/.config/starship.toml"
volume="$HOME/.config/micro:$HOME/distrobox-homes/dev-go/.config/micro:ro"

additional_packages="golang"
init_hooks="echo GOPATH=$HOME/go >> $HOME/.zshenv"

[dev-rust]
include=dev-base
hostname="dev-rust"
home=~/distrobox-homes/dev-rust

volume="$HOME/.gitconfig:$HOME/distrobox-homes/dev-rust/.gitconfig:ro"
volume="$HOME/.ssh:$HOME/distrobox-homes/dev-rust/.ssh:ro"
volume="$HOME/.zshrc:$HOME/distrobox-homes/dev-rust/.zshrc:ro"
volume="$HOME/.oh-my-zsh:$HOME/distrobox-homes/dev-rust/.oh-my-zsh:ro"
#volume="$HOME/distrobox-homes/setup/rust-setup.sh:$HOME/distrobox-homes/dev-rust/rust-setup.sh:ro"
volume="$HOME/.config/micro:$HOME/distrobox-homes/dev-rust/.config/micro:ro"

additional_packages="cc"
init_hooks="su - matteo $HOME/distrobox-homes/setup/rust-setup.sh"

[dev-cpp]
include=dev-base
hostname="dev-cpp"
home=~/distrobox-homes/dev-cpp

volume="$HOME/.gitconfig:$HOME/distrobox-homes/dev-cpp/.gitconfig:ro"
volume="$HOME/.ssh:$HOME/distrobox-homes/dev-cpp/.ssh:ro"
volume="$HOME/.zshrc:$HOME/distrobox-homes/dev-cpp/.zshrc:ro"
volume="$HOME/.oh-my-zsh:$HOME/distrobox-homes/dev-cpp/.oh-my-zsh:ro"
#volume="$HOME/distrobox-homes/setup/rust-setup.sh:$HOME/distrobox-homes/dev-rust/rust-setup.sh:ro"
volume="$HOME/.config/micro:$HOME/distrobox-homes/dev-cpp/.config/micro:ro"

additional_packages="cmake g++ glfw-devel assimp-devel glm-devel google-benchmark-devel libwayland-cursor"

[dev-java]
include=dev-base
hostname="dev-java"
home=~/distrobox-homes/dev-java

volume="$HOME/.gitconfig:$HOME/distrobox-homes/dev-java/.gitconfig:ro"
volume="$HOME/.ssh:$HOME/distrobox-homes/dev-java/.ssh:ro"
volume="$HOME/.zshrc:$HOME/distrobox-homes/dev-java/.zshrc:ro"
volume="$HOME/.oh-my-zsh:$HOME/distrobox-homes/dev-java/.oh-my-zsh:ro"
volume="$HOME/.config/micro:$HOME/distrobox-homes/dev-java/.config/micro:ro"

additional_packages="java-25-openjdk-devel mesa-libGL"
