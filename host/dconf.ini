# Generated by 'dotfiles gnome dump'. Restore with 'dotfiles gnome restore'.
# Tracked paths are listed in host/dconf-paths.txt.

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>t'
command='ptyxis'
name='Terminal'

[org/gnome/desktop/wm/keybindings]
move-to-monitor-left=@as []
move-to-monitor-right=@as []
move-to-workspace-left=['<Shift><Super>Left']
move-to-workspace-right=['<Shift><Super>Right']
switch-applications=@as []
switch-applications-backward=@as []
switch-to-workspace-left=['<Control><Super>Left']
switch-to-workspace-right=['<Control><Super>Right']
switch-windows=['<Alt>Tab']
switch-windows-backward=['<Shift><Alt>Tab']

[org/gnome/shell]
favorite-apps=['org.mozilla.firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Ptyxis.desktop', 'org.gnome.Software.desktop', 'org.gnome.Calendar.desktop', 'org.gnome.TextEditor.desktop', 'com.jeffser.Nocturne.desktop', 'com.spotify.Client.desktop', 'org.mozilla.thunderbird.desktop']
