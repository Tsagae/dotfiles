# Distrobox definitions. Use through the wrapper (it skips the _template sections):
#
#   dotfiles boxes create [name...]    # create missing boxes
#   dotfiles boxes replace [name...]   # destroy + recreate (homes are kept)
#
# Every box:
#   - has its own home in ~/distrobox-homes/<name> (nothing is shared with the host home)
#   - gets the host's ~/.ssh mounted read-only at /mnt/host-ssh; ~/.ssh links to it
#   - on first start, runs bootstrap.sh as root (init_hooks): it clones this repo
#     into ~/dotfiles *inside the box home*, installs packages and links the
#     dotfiles. Later starts skip it (marker in /var/lib/dotfiles, i.e. in the
#     container filesystem, so a recreated box sets itself up again).
#   - profiles (folders in profiles/) are selected with DOTFILES_PROFILES.
#
# Note: "$HOME" below is expanded on the host by distrobox-assemble (= /home/<you>).
# Do not use other $variables in init_hooks: they would be expanded on the host too.

[_base]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=true
# zsh as login shell: distrobox installs it and keeps it as the user's shell.
pre_init_hooks="export SHELL=/usr/bin/zsh"
volume="$HOME/.ssh:/mnt/host-ssh:ro"
init_hooks="test -e /var/lib/dotfiles/bootstrapped || curl -fsSL https://raw.githubusercontent.com/Tsagae/dotfiles/main/bootstrap.sh | bash -s -- container || echo 'dotfiles bootstrap FAILED, run: ~/dotfiles/dotfiles container'"

# ---------------------------------------------------------------- boxes -----

[fedorabox]
include=_base
hostname=fedorabox
home=~/distrobox-homes/fedorabox
# CLI tools used from the host, exported to ~/.local/bin on the host.
additional_packages="wol rsync tldr nmap"
exported_bins="/usr/bin/wol /usr/bin/rsync /usr/bin/tldr /usr/bin/nmap"
exported_bins_path="$HOME/.local/bin"

[ubuntubox]
include=_base
image=quay.io/toolbx/ubuntu-toolbox:latest
hostname=ubuntubox
home=~/distrobox-homes/ubuntubox

[dev-go]
include=_base
hostname=dev-go
home=~/distrobox-homes/dev-go
additional_flags="--env DOTFILES_PROFILES=dev,go"

[dev-rust]
include=_base
hostname=dev-rust
home=~/distrobox-homes/dev-rust
additional_flags="--env DOTFILES_PROFILES=dev,rust"

[dev-cpp]
include=_base
hostname=dev-cpp
home=~/distrobox-homes/dev-cpp
additional_flags="--env DOTFILES_PROFILES=dev,cpp"

[dev-java]
include=_base
hostname=dev-java
home=~/distrobox-homes/dev-java
additional_flags="--env DOTFILES_PROFILES=dev"
